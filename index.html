<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreelanceHub</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family: Arial; }
    .page { display:none; }
    .active { display:block; }
  </style>
</head>

<body>

<!-- NAV -->
<button onclick="showPage('home')">Home</button>
<button onclick="showPage('browse')">Browse</button>

<!-- HOME -->
<div id="page-home" class="page active">
  <h1>Home</h1>
  <input id="hero-search" placeholder="Search">
  <button onclick="doSearch()">Search</button>

  <div id="categories-grid"></div>
  <div id="featured-gigs"></div>
</div>

<!-- BROWSE -->
<div id="page-browse" class="page">
  <h1>Browse</h1>

  <input id="browse-search" oninput="filterGigs()" placeholder="Search...">

  <input id="min-price" type="number" placeholder="Min" oninput="filterGigs()">
  <input id="max-price" type="number" placeholder="Max" oninput="filterGigs()">

  <div id="gigs-count"></div>
  <div id="browse-gigs"></div>
</div>

<!-- TOAST -->
<div id="toast" style="display:none; position:fixed; bottom:20px; right:20px; background:black; color:white; padding:10px;"></div>

<!-- ================= JS ADDED HERE ================= -->
<script>

/* DATA */
const gigs = [
  { id:1, title:"Web Design UI", category:"Web Design", price:50, rating:4.9 },
  { id:2, title:"Logo Design", category:"Logo Design", price:25, rating:4.8 },
  { id:3, title:"WordPress Site", category:"WordPress", price:80, rating:5.0 },
  { id:4, title:"Mobile App UI", category:"Mobile App", price:60, rating:4.7 },
];

const categories = ["Web Design","Logo Design","WordPress","Mobile App"];

/* NAVIGATION */
function showPage(page) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
}

/* TOAST */
function showToast(msg) {
  const t = document.getElementById("toast");
  t.innerText = msg;
  t.style.display = "block";
  setTimeout(()=> t.style.display="none", 3000);
}

/* SEARCH */
function doSearch() {
  const val = document.getElementById("hero-search").value.toLowerCase();
  document.getElementById("browse-search").value = val;
  showPage("browse");
  filterGigs();
}

function quickSearch(q) {
  document.getElementById("hero-search").value = q;
  doSearch();
}

/* RENDER */
function renderGigs(list) {
  const box = document.getElementById("browse-gigs");
  box.innerHTML = "";

  list.forEach(g => {
    box.innerHTML += `
      <div style="border:1px solid #ccc; margin:10px; padding:10px;">
        <h3>${g.title}</h3>
        <p>${g.category}</p>
        <span>⭐ ${g.rating}</span>
        <span>$${g.price}</span>
      </div>
    `;
  });

  document.getElementById("gigs-count").innerText = list.length + " services found";
}

/* FILTER */
function filterGigs() {
  let search = document.getElementById("browse-search").value.toLowerCase();
  let min = document.getElementById("min-price").value;
  let max = document.getElementById("max-price").value;

  let filtered = gigs.filter(g => {
    return (
      g.title.toLowerCase().includes(search) &&
      (!min || g.price >= min) &&
      (!max || g.price <= max)
    );
  });

  renderGigs(filtered);
}

/* INIT */
function init() {
  // categories
  const catBox = document.getElementById("categories-grid");
  categories.forEach(c => {
    catBox.innerHTML += `<div onclick="quickSearch('${c}')">${c}</div>`;
  });

  // featured
  const feat = document.getElementById("featured-gigs");
  gigs.forEach(g => {
    feat.innerHTML += `<div>${g.title}</div>`;
  });

  renderGigs(gigs);
}

init();

</script>

</body>
                              </html>
