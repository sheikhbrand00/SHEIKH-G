<!DOCTYPE html>
<html>
<head>
  <title>Freelance Platform</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
    }

    input, select, button, textarea {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 10px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 10px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<header>
  <h1>Freelancing Website</h1>
</header>

<div class="container">

  <!-- AUTH SECTION -->
  <div id="auth">
    <h2>Register</h2>
    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <input id="password" placeholder="Password">
    <select id="role">
      <option value="client">Client</option>
      <option value="freelancer">Freelancer</option>
    </select>
    <button onclick="register()">Register</button>

    <h2>Login</h2>
    <input id="lEmail" placeholder="Email">
    <input id="lPassword" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="hidden">
    <h2>Dashboard</h2>
    <button onclick="logout()">Logout</button>

    <h3>Post Project</h3>
    <input id="title" placeholder="Project Title">
    <textarea id="desc" placeholder="Description"></textarea>
    <input id="budget" placeholder="Budget">
    <button onclick="postProject()">Post Project</button>

    <h3>All Projects</h3>
    <div id="projects"></div>
  </div>

</div>

<script>
  let users = JSON.parse(localStorage.getItem("users")) || [];
  let projects = JSON.parse(localStorage.getItem("projects")) || [];
  let currentUser = JSON.parse(localStorage.getItem("currentUser"));

  function saveData() {
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.setItem("projects", JSON.stringify(projects));
    localStorage.setItem("currentUser", JSON.stringify(currentUser));
  }

  function register() {
    const user = {
      name: name.value,
      email: email.value,
      password: password.value,
      role: role.value
    };

    users.push(user);
    saveData();
    alert("Registered Successfully!");
  }

  function login() {
    const user = users.find(u => u.email === lEmail.value && u.password === lPassword.value);

    if (user) {
      currentUser = user;
      saveData();
      showDashboard();
    } else {
      alert("Login Failed");
    }
  }

  function logout() {
    currentUser = null;
    saveData();
    location.reload();
  }

  function showDashboard() {
    document.getElementById("auth").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    loadProjects();
  }

  function postProject() {
    const project = {
      title: title.value,
      description: desc.value,
      budget: budget.value,
      client: currentUser.email
    };

    projects.push(project);
    saveData();
    loadProjects();
  }

  function loadProjects() {
    const container = document.getElementById("projects");

    container.innerHTML = projects.map(p => `
      <div class="card">
        <h3>${p.title}</h3>
        <p>${p.description}</p>
        <p><b>Budget:</b> ${p.budget}</p>
        <p><b>Client:</b> ${p.client}</p>
        ${currentUser.role === "freelancer" ? `<button onclick="bid('${p.title}')">Bid</button>` : ""}
      </div>
    `).join("");
  }

  function bid(title) {
    alert("Bid sent on: " + title);
  }

  // Auto login check
  if (currentUser) {
    showDashboard();
  }
</script>

</body>
  </html>
