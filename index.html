<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kicks - Step Into Comfort</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #f5f5f5;
    }

    /* Navbar */
    header {
      background: #111;
      color: white;
      padding: 15px 50px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      color: orange;
    }

    nav a {
      color: white;
      margin: 0 15px;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: orange;
    }

    /* Hero Section */
    .hero {
      height: 80vh;
      background: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff') no-repeat center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    .hero h2 {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .hero button {
      padding: 12px 25px;
      border: none;
      background: orange;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    /* Products */
    .products {
      padding: 50px;
      text-align: center;
    }

    .products h2 {
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card h3 {
      margin: 10px 0;
    }

    .card p {
      color: orange;
      font-weight: bold;
    }

    .card button {
      margin-top: 10px;
      padding: 8px 15px;
      border: none;
      background: black;
      color: white;
      cursor: pointer;
      border-radius: 5px;
    }

    /* About */
    .about {
      padding: 50px;
      background: #111;
      color: white;
      text-align: center;
    }

    /* Footer */
    footer {
      padding: 20px;
      text-align: center;
      background: black;
      color: white;
    }

    /* Mobile */
    @media(max-width: 768px) {
      header {
        flex-direction: column;
      }

      nav {
        margin-top: 10px;
      }

      .hero h2 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <h1>Kicks</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Men</a>
      <a href="#">Women</a>
      <a href="#">Sale</a>
    </nav>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div>
      <h2>Step Into Comfort</h2>
      <button onclick="shopNow()">Shop Now</button>
    </div>
  </section>

  <!-- Products -->
  <section class="products">
    <h2>Featured Shoes</h2>

    <div class="product-grid">

      <div class="card">
        <img src="https://images.unsplash.com/photo-1600180758890-6b94519a8ba2">
        <h3>Running Shoes</h3>
        <p>$49</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1528701800489-20be3c3c35c7">
        <h3>Casual Sneakers</h3>
        <p>$59</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a">
        <h3>Sport Shoes</h3>
        <p>$69</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1519744346363-dc1d5f1e61f0">
        <h3>Fashion Shoes</h3>
        <p>$79</p>
        <button onclick="addToCart()">Add to Cart</button>
      </div>

    </div>
  </section>

  <!-- About -->
  <section class="about">
    <h2>Why Choose Us?</h2>
    <p>High quality shoes, best prices, and fast delivery. Step into style with Kicks.</p>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Kicks Store | All Rights Reserved</p>
  </footer>

  <!-- JavaScript -->
  <script>
    function addToCart() {
      alert("Item added to cart!");
    }

    function shopNow() {
      alert("Scroll down to shop!");
      window.scrollTo({
        top: document.querySelector(".products").offsetTop,
        behavior: "smooth"
      });
    }
  </script>

</body>
   </html>
